server:
  port: 8080

management:
  endpoint:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,env

spring:
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    use-root-path: true
    urls:
      - name: v1
        url: specs-storage-v1.yaml
      - name: v2
        url: specs-storage-v2.yaml
      - name: logv1
        url: specs-storage-logv1.yaml

catalogOfStorages:
  repository:
    test: "inmemory"
    prod: "$DB_TYPE_PROD:inmemory"
