server:
  port: 8080

management:
  endpoint:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,env,health

spring:
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    use-root-path: true
    urls:
      - name: v1
        url: specs-storage-v1.yaml
      - name: v2
        url: specs-storage-v2.yaml
      - name: logv1
        url: specs-storage-logv1.yaml

catalogOfStorages:
  repository:
    test: "inmemory"
    prod: "$DB_TYPE_PROD:inmemory"

psql:
  schema: public
  database: "${CATALOG_STORAGES_DB:catalog-of-storages}"
  host: "${CATALOG_STORAGES_DB_HOST:localhost}"
  port: "${CATALOG_STORAGES_DB_PORT:5433}"
  user: "${CATALOG_STORAGES_DB_USER:postgres}"
  password: "${CATALOG_STORAGES_DB_PASS:catalog-of-storages-pass}"

logging:
  level:
    org:
      springframework:
        http:
          codec: DEBUG
        web: DEBUG
        reactive:
          result:
            method:
              annotation: DEBUG
    reactor:
      netty:
        http:
          client:
            HttpClient: TRACE